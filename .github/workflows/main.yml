name: Build and Release PDF

permissions:
  contents: write

# Läuft bei jedem Push/PR auf main sowie manuell über den "Actions"-Tab.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      # AuFS.org und die exercises/*.org sind die Quelle der Wahrheit. Emacs'
      # eingebautes Org-Mode exportiert daraus die eigentlichen LaTeX-Dokumente,
      # bevor sie kompiliert werden. Dafür genügt "emacs-nox" (ohne GUI) inkl.
      # des mitgelieferten Org-Mode und ox-beamer-Backends - keine private
      # Emacs-Konfiguration nötig.
      - name: Emacs installieren
        run: sudo apt-get update && sudo apt-get install -y emacs-nox

      - name: Vorlesungsfolien (AuFS.org) zu LaTeX exportieren
        run: |
          emacs --batch AuFS.org -l org -l ox-beamer \
            --eval '(org-export-to-file (quote beamer) "AuFS.tex")'

      # Die Übungsblätter nutzen die KOMA-Script-Klasse scrartcl, die Org von
      # Haus aus nicht kennt ("Unknown LaTeX class"). exercises/org-export-setup.el
      # registriert sie und entschärft den capt-of/KOMA-Konflikt - siehe die
      # Kommentare dort. So bleibt der Export von einer privaten ~/.emacs
      # unabhängig und in CI wie lokal identisch.
      - name: Übungsblätter (exercises/*.org) zu LaTeX exportieren
        working-directory: exercises
        run: |
          for f in exercise_*.org; do
            base="${f%.org}"
            emacs --batch -l ./org-export-setup.el "$f" -l org \
              --eval "(org-export-to-file (quote latex) \"${base}.tex\")"
          done

      # Kompiliert in einem eigenen Docker-Container mit vollständigem
      # TeXLive (latexmk übernimmt automatisch die nötigen Mehrfachläufe
      # für Inhaltsverzeichnis/Referenzen). Ein separates "texlive"-Setup
      # auf dem Runner selbst ist dafür nicht nötig.
      - name: Vorlesungsfolien kompilieren
        uses: xu-cheng/latex-action@v4
        with:
          root_file: AuFS.tex

      - name: Übungsblätter kompilieren
        uses: xu-cheng/latex-action@v4
        with:
          root_file: exercises/exercise_*.tex

      - name: Vorlesungsfolien als Artifact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: AuFS-PDF
          path: AuFS.pdf

      - name: Übungsblätter als Artifact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Uebungsblaetter-PDF
          path: exercises/exercise_*.pdf

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-${{ github.run_number }}
          files: |
            AuFS.pdf
            exercises/exercise_*.pdf
          generate_release_notes: true
          make_latest: true
